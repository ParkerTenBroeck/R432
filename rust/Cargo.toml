[package]
name = "powder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "powder"
path = "src/powder_main.rs"
test = false
bench = false

[[bin]]
name = "native"
path = "src/native_main.rs"
required-features = [ "native" ]

[profile.release]
panic = "abort"
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
panic = "abort"

[features]
default = [ ]
native = [ "dep:rand" ]

[dependencies]
rand = { version = "0.10.3", optional = true }

