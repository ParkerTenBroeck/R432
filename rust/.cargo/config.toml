[alias]
run-powder = "run --release -p powder --target riscv32i-unknown-none-elf --bin powder"
run-native = "run --release -p powder --features=native --bin native"

[target.riscv32i-unknown-none-elf]
runner = "./xrun.sh"
rustflags = [
    "-C", "target-cpu=generic-rv32",
    "-C", "target-feature=+zicond,+zifencei,-a,-c,-b,-zba,-zbb,-zbc,-zbkb,-zbkc,-zbkx,-zbs",
    "-C", "link-args=-nostdlib",
    "-C", "link-arg=-Tld/hardware.ld",
    "-C", "link-arg=-Tld/common.ld",
    "-C", "link-arg=--no-relax",
    "-C", "force-unwind-tables=no",
    "-C", "llvm-args=-enable-machine-outliner=never",
    "-C", "link-arg=--gc-sections",
]
